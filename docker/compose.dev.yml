name: bizziemoney-dev

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    command:
      - node
      - /workspace/node_modules/vite/bin/vite.js
      - apps/web
      - --host
      - 0.0.0.0
    environment:
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-}
      VITE_API_PROXY_TARGET: http://api:3000
    ports:
      - '${WEB_PORT:-5173}:5173'
    volumes:
      - ..:/workspace
      - bizziemoney_node_modules:/workspace/node_modules
      - bizziemoney_api_node_modules:/workspace/apps/api/node_modules
      - bizziemoney_web_node_modules:/workspace/apps/web/node_modules
      - bizziemoney_worker_node_modules:/workspace/apps/worker/node_modules
      - bizziemoney_config_node_modules:/workspace/packages/config/node_modules
      - bizziemoney_database_node_modules:/workspace/packages/database/node_modules
      - bizziemoney_shared_node_modules:/workspace/packages/shared/node_modules
      - bizziemoney_storage_node_modules:/workspace/packages/storage/node_modules
      - bizziemoney_ui_node_modules:/workspace/packages/ui/node_modules

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    command:
      - node
      - /workspace/node_modules/tsx/dist/cli.mjs
      - watch
      - --tsconfig
      - apps/api/tsconfig.json
      - apps/api/src/index.ts
    environment:
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-http://localhost:5173}
      APP_URL: ${APP_URL:-http://localhost:5173}
      ATTACHMENT_ALLOWED_MIME_TYPES: ${ATTACHMENT_ALLOWED_MIME_TYPES:-application/pdf,image/png,image/jpeg,image/webp,text/plain,text/csv}
      ATTACHMENT_LOCAL_PATH: ${ATTACHMENT_LOCAL_PATH:-/data/attachments}
      ATTACHMENT_MALWARE_SCANNER: ${ATTACHMENT_MALWARE_SCANNER:-disabled}
      ATTACHMENT_S3_ACCESS_KEY_ID: ${ATTACHMENT_S3_ACCESS_KEY_ID:-}
      ATTACHMENT_S3_BUCKET: ${ATTACHMENT_S3_BUCKET:-}
      ATTACHMENT_S3_ENDPOINT: ${ATTACHMENT_S3_ENDPOINT:-}
      ATTACHMENT_S3_FORCE_PATH_STYLE: ${ATTACHMENT_S3_FORCE_PATH_STYLE:-false}
      ATTACHMENT_S3_PREFIX: ${ATTACHMENT_S3_PREFIX:-bizziemoney}
      ATTACHMENT_S3_REGION: ${ATTACHMENT_S3_REGION:-auto}
      ATTACHMENT_S3_SECRET_ACCESS_KEY: ${ATTACHMENT_S3_SECRET_ACCESS_KEY:-}
      ATTACHMENT_STORAGE_PROVIDER: ${ATTACHMENT_STORAGE_PROVIDER:-local}
      BACKUP_LOCAL_PATH: ${BACKUP_LOCAL_PATH:-/data/backups}
      BACKUP_SECRETS_KEY: ${BACKUP_SECRETS_KEY:-}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_TIMEOUT_MS: ${CLAMAV_TIMEOUT_MS:-30000}
      API_HOST: 0.0.0.0
      API_PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-20}
      NODE_ENV: development
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      TZ: ${TZ:-Asia/Riyadh}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${API_PORT:-3001}:3000'
    volumes:
      - ..:/workspace
      - bizziemoney_node_modules:/workspace/node_modules
      - bizziemoney_api_node_modules:/workspace/apps/api/node_modules
      - bizziemoney_web_node_modules:/workspace/apps/web/node_modules
      - bizziemoney_worker_node_modules:/workspace/apps/worker/node_modules
      - bizziemoney_config_node_modules:/workspace/packages/config/node_modules
      - bizziemoney_database_node_modules:/workspace/packages/database/node_modules
      - bizziemoney_shared_node_modules:/workspace/packages/shared/node_modules
      - bizziemoney_storage_node_modules:/workspace/packages/storage/node_modules
      - bizziemoney_ui_node_modules:/workspace/packages/ui/node_modules
      - ../.data/attachments:/data/attachments
      - ../.data/backups:/data/backups

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    command:
      - node
      - /workspace/node_modules/tsx/dist/cli.mjs
      - watch
      - --tsconfig
      - apps/worker/tsconfig.json
      - apps/worker/src/index.ts
    environment:
      ATTACHMENT_CLEANUP_INTERVAL_MS: ${ATTACHMENT_CLEANUP_INTERVAL_MS:-5000}
      ATTACHMENT_LOCAL_PATH: ${ATTACHMENT_LOCAL_PATH:-/data/attachments}
      ATTACHMENT_S3_ACCESS_KEY_ID: ${ATTACHMENT_S3_ACCESS_KEY_ID:-}
      ATTACHMENT_S3_BUCKET: ${ATTACHMENT_S3_BUCKET:-}
      ATTACHMENT_S3_ENDPOINT: ${ATTACHMENT_S3_ENDPOINT:-}
      ATTACHMENT_S3_FORCE_PATH_STYLE: ${ATTACHMENT_S3_FORCE_PATH_STYLE:-false}
      ATTACHMENT_S3_PREFIX: ${ATTACHMENT_S3_PREFIX:-bizziemoney}
      ATTACHMENT_S3_REGION: ${ATTACHMENT_S3_REGION:-auto}
      ATTACHMENT_S3_SECRET_ACCESS_KEY: ${ATTACHMENT_S3_SECRET_ACCESS_KEY:-}
      ATTACHMENT_STORAGE_PROVIDER: ${ATTACHMENT_STORAGE_PROVIDER:-local}
      BACKUP_JOB_INTERVAL_MS: ${BACKUP_JOB_INTERVAL_MS:-5000}
      BACKUP_LOCAL_PATH: ${BACKUP_LOCAL_PATH:-/data/backups}
      BACKUP_SECRETS_KEY: ${BACKUP_SECRETS_KEY:-}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      SESSION_MAINTENANCE_INTERVAL_MS: ${SESSION_MAINTENANCE_INTERVAL_MS:-21600000}
      SESSION_RETENTION_DAYS: ${SESSION_RETENTION_DAYS:-30}
      SUBSCRIPTION_REMINDER_INTERVAL_MS: ${SUBSCRIPTION_REMINDER_INTERVAL_MS:-60000}
      TZ: ${TZ:-Asia/Riyadh}
      WORKER_HEARTBEAT_INTERVAL_MS: ${WORKER_HEARTBEAT_INTERVAL_MS:-30000}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ..:/workspace
      - bizziemoney_node_modules:/workspace/node_modules
      - bizziemoney_api_node_modules:/workspace/apps/api/node_modules
      - bizziemoney_web_node_modules:/workspace/apps/web/node_modules
      - bizziemoney_worker_node_modules:/workspace/apps/worker/node_modules
      - bizziemoney_config_node_modules:/workspace/packages/config/node_modules
      - bizziemoney_database_node_modules:/workspace/packages/database/node_modules
      - bizziemoney_shared_node_modules:/workspace/packages/shared/node_modules
      - bizziemoney_storage_node_modules:/workspace/packages/storage/node_modules
      - bizziemoney_ui_node_modules:/workspace/packages/ui/node_modules
      - ../.data/attachments:/data/attachments
      - ../.data/backups:/data/backups

  clamav:
    image: clamav/clamav:1.4.5-debian13-slim
    profiles: ['malware-scan']
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - bizziemoney_clamav_data:/var/lib/clamav

  postgres:
    image: postgres:18-alpine
    profiles: ['local-db']
    environment:
      POSTGRES_DB: bizziemoney
      POSTGRES_USER: bizziemoney
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for local-db}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bizziemoney -d bizziemoney']
      interval: 5s
      timeout: 3s
      retries: 15
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - bizziemoney_postgres_dev:/var/lib/postgresql

volumes:
  bizziemoney_node_modules:
    name: bizziemoney_node_modules
  bizziemoney_web_node_modules:
    name: bizziemoney_web_node_modules
  bizziemoney_api_node_modules:
    name: bizziemoney_api_node_modules
  bizziemoney_worker_node_modules:
    name: bizziemoney_worker_node_modules
  bizziemoney_database_node_modules:
    name: bizziemoney_database_node_modules
  bizziemoney_storage_node_modules:
    name: bizziemoney_storage_node_modules
  bizziemoney_config_node_modules:
    name: bizziemoney_config_node_modules
  bizziemoney_ui_node_modules:
    name: bizziemoney_ui_node_modules
  bizziemoney_shared_node_modules:
    name: bizziemoney_shared_node_modules
  bizziemoney_postgres_dev:
    name: bizziemoney_postgres_dev
  bizziemoney_clamav_data:
    name: bizziemoney_clamav_data
